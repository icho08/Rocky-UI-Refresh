buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.1'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
}

configurations {
    shadow
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation 'org.projectlombok:lombok:1.18.46'
    annotationProcessor('org.projectlombok:lombok:1.18.46')

    compileOnly files("lib/annotations-1.0.6.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

    from {
        configurations.shadow.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                "Main-Class":             "dev.i726.rocky.utils.StandaloneBootstrap",
                "Agent-Class":            "dev.i726.rocky.utils.StandaloneBootstrap",
                "Premain-Class":          "dev.i726.rocky.utils.StandaloneBootstrap",
                "Can-Retransform-Classes":"true",
                "Can-Redefine-Classes":   "true",
                "Permissions":            "all-permissions"
        )
    }
}

task obfuscate(type: proguard.gradle.ProGuardTask, dependsOn: jar) {
    def inputJar  = jar.archiveFile.get().asFile
    def outputJar = file("${buildDir}/libs/${archives_base_name}-${version}-obf.jar")

    injars(inputJar)
    outjars(outputJar)

    def javaHome = System.getProperty('java.home')
    // Use JDK modules image (lib/modules) for Java 9+ or fall back to jmods directory
    def modulesImg = file("${javaHome}/lib/modules")
    def jmodsDir   = file("${javaHome}/jmods")
    if (modulesImg.exists()) {
        libraryjars("${javaHome}/lib/modules")
    } else if (jmodsDir.exists()) {
        fileTree(jmodsDir).include('*.jmod').each { File jmod ->
            libraryjars(jmod, filter: '!**.jar,!module-info.class')
        }
    }

    configuration('proguard.pro')

    doFirst {
        configurations.compileClasspath.each { File f ->
            if (f.exists() && f.name.endsWith('.jar')) {
                libraryjars(f)
            }
        }
    }

    printmapping("${buildDir}/libs/mapping.txt")
    verbose()
}

// Obfuscation is a separate optional step; run ./gradlew obfuscate to produce the -obf.jar
// build.dependsOn obfuscate

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
