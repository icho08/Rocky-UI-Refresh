buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.1'
    }
}

plugins {
    id 'fabric-loom' version '1.16.1'
    id 'maven-publish'
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "rocky-refmap.json"
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
}

configurations {
    shadow
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation 'org.projectlombok:lombok:1.18.46'
    annotationProcessor('org.projectlombok:lombok:1.18.46')
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly files("lib/annotations-1.0.6.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
        it.options.compilerArgs.addAll(['--add-modules', 'jdk.attach'])
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

    // Include JARs from lib/ directory in the final JAR
    from {
        configurations.shadow.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Avoid duplicating META-INF files when merging libraries
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                "Main-Class": "dev.i726.rocky.utils.StandaloneBootstrap",
                "Agent-Class": "dev.i726.rocky.utils.StandaloneBootstrap",
                "Can-Retransform-Classes": "true",
                "Can-Redefine-Classes": "true",
                "Permissions": "all-permissions"
        )
    }
}

task obfuscate(type: proguard.gradle.ProGuardTask, dependsOn: remapJar) {
    def inputJar  = remapJar.archiveFile.get().asFile
    def outputJar = file("${buildDir}/libs/${archives_base_name}-${version}-obf.jar")

    injars(inputJar)
    outjars(outputJar)

    // Java runtime library
    def javaHome = System.getProperty('java.home')
    libraryjars("${javaHome}/jmods/java.base.jmod", filter: '!**.jar,!module-info.class')
    libraryjars("${javaHome}/jmods/java.desktop.jmod", filter: '!**.jar,!module-info.class')

    configuration('proguard.pro')

    // Minecraft and Fabric jars from loom's cache (deferred to execution time
    // so Fabric Loom can finish setting up its MinecraftProvider first)
    doFirst {
        configurations.compileClasspath.each { File f ->
            if (f.exists() && f.name.endsWith('.jar')) {
                libraryjars(f)
            }
        }
    }

    printmapping("${buildDir}/libs/mapping.txt")
    verbose()
}

build.dependsOn obfuscate

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}